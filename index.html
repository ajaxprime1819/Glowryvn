<!-- DEPOSIT MODAL (QR CODE & THẺ CÀO) -->
<div class="modal" id="depositModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('depositModal')">&times;</span>
        <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-wallet"></i> NẠP TIỀN VÀO TÀI KHOẢN</h3>
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="btnTabQR" class="btn btn-primary" style="flex:1;" onclick="switchDepositTab('qr')"><i class="fa-solid fa-qrcode"></i> Nạp qua QR Code</button>
            <button id="btnTabCard" class="btn btn-login" style="flex:1;" onclick="switchDepositTab('card')"><i class="fa-solid fa-credit-card"></i> Nạp Thẻ Cào</button>
        </div>

        <!-- TAB NẠP QR -->
        <div id="depositTabQR">
            <label style="font-size:13px; color:#cbd5e1;">Nhập số tiền muốn nạp (VNĐ):</label>
            <input type="number" id="qrAmount" class="form-input" placeholder="VD: 50000, 100000..." min="10000">
            <button class="btn btn-success" style="width:100%; margin-bottom:15px;" onclick="generateQRCode()"><i class="fa-solid fa-qrcode"></i> TẠO MÃ QR CHUYỂN KHOẢN</button>
            
            <div id="qrResultBox" style="text-align:center; display:none; background:#0f172a; padding:15px; border-radius:8px; border:1px solid #334155;">
                <img id="qrCodeImage" src="" alt="QR Code" style="max-width:200px; border-radius:8px; margin-bottom:10px; background:#fff; padding:5px;">
                <p style="font-size:13px; color:#cbd5e1; margin-bottom:5px;">Quét mã QR bằng App Ngân Hàng</p>
                <p style="font-size:12px; color:#f59e0b;">Nội dung chuyển khoản chính xác:</p>
                <b id="qrContentInfo" style="color:#22c55e; font-size:15px; background:#1e293b; padding:5px 10px; display:inline-block; margin-top:5px; border-radius:4px;"></b>
            </div>
        </div>

        <!-- TAB NẠP THẺ CÀO -->
        <div id="depositTabCard" style="display: none;">
            <form onsubmit="submitCardDeposit(event)">
                <label style="font-size:13px; color:#cbd5e1;">Chọn nhà mạng:</label>
                <select id="cardTelco" class="form-input" style="font-weight:bold; color:#3b82f6;">
                    <option value="VIETTEL">Viettel</option>
                    <option value="VINAPHONE">Vinaphone</option>
                    <option value="MOBIFONE">Mobifone</option>
                </select>

                <label style="font-size:13px; color:#cbd5e1;">Chọn mệnh giá:</label>
                <select id="cardAmount" class="form-input" style="font-weight:bold; color:#22c55e;">
                    <option value="10000">10.000 đ</option>
                    <option value="20000">20.000 đ</option>
                    <option value="50000">50.000 đ</option>
                    <option value="100000">100.000 đ</option>
                    <option value="200000">200.000 đ</option>
                    <option value="500000">500.000 đ</option>
                </select>

                <label style="font-size:13px; color:#cbd5e1;">Mã thẻ cào (PIN):</label>
                <input type="text" id="cardPin" class="form-input" required placeholder="Nhập mã thẻ...">

                <label style="font-size:13px; color:#cbd5e1;">Số Seri thẻ:</label>
                <input type="text" id="cardSerial" class="form-input" required placeholder="Nhập số seri...">

                <button type="submit" class="btn btn-warning" style="width:100%; margin-top:10px;"><i class="fa-solid fa-paper-plane"></i> GỬI THẺ CÀO NẠP</button>
            </form>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ybrqeguquwwzeonblmvo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OKt965Ba1R5lGF0ogTxloQ_2XwrPBBU'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let authMode = 'login';
    let selectedAccToBuy = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
            currentUser = data.session.user;
        }
        await checkUserStatus();
        await renderShopItems();
    });

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    /* --- AUTHENTICATION --- */
    function openAuthModal(mode) {
        authMode = mode;
        document.getElementById('modalTitle').innerText = mode === 'login' ? 'ĐĂNG NHẬP' : 'ĐĂNG KÝ TÀI KHOẢN';
        document.getElementById('modalSubmitBtn').innerText = mode === 'login' ? 'ĐĂNG NHẬP' : 'ĐĂNG KÝ';
        openModal('authModal');
    }

    async function handleAuthSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (authMode === 'register') {
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) return showToast(error.message, 'error');
            
            await supabaseClient.from('user_balances').insert([{ email: email, balance: 0 }]);
            showToast('Đăng ký thành công!', 'success');
            currentUser = data.user;
        } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) return showToast('Email hoặc mật khẩu không đúng!', 'error');
            currentUser = data.user;
            showToast('Đăng nhập thành công!', 'success');
        }
        
        closeModal('authModal');
        checkUserStatus();
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        currentUser = null;
        checkUserStatus();
        showToast('Đã đăng xuất!', 'success');
    }

    /* --- SỐ DƯ & QUẢN LÝ SỐ DƯ --- */
    async function getUserBalance(email) {
        const { data } = await supabaseClient.from('user_balances').select('balance').eq('email', email).maybeSingle();
        return data ? data.balance : 0;
    }

    async function updateUserBalance(email, amountChange) {
        const currentBal = await getUserBalance(email);
        const newBal = currentBal + amountChange;
        await supabaseClient.from('user_balances').upsert({ email: email, balance: newBal }, { onConflict: 'email' });
        return newBal;
    }

    async function checkUserStatus() {
        const authContainer = document.getElementById('auth-buttons');
        if (!authContainer) return;
        if (currentUser) {
            const balance = await getUserBalance(currentUser.email);
            authContainer.innerHTML = `
                <span style="font-size:14px; font-weight:bold; color:#22c55e;"><i class="fa-solid fa-wallet"></i> ${balance.toLocaleString('vi-VN')} đ</span>
                <span style="font-size:14px; color:#94a3b8;"><i class="fa-solid fa-user"></i> ${currentUser.email}</span>
                ${currentUser.email === 'admin@gmail.com' ? `<button class="btn btn-warning" onclick="openAdminDashboard()"><i class="fa-solid fa-gear"></i> Admin</button>` : ''}
                <button class="btn btn-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            `;
        } else {
            authContainer.innerHTML = `
                <button class="btn btn-login" onclick="openAuthModal('login')"><i class="fa-solid fa-user"></i> Đăng nhập</button>
                <button class="btn btn-primary" onclick="openAuthModal('register')"><i class="fa-solid fa-user-plus"></i> Đăng ký</button>
            `;
        }
    }

    /* --- RENDER SẢN PHẨM --- */
    async function renderShopItems() {
        const { data: accGameList } = await supabaseClient.from('acc_games').select('*');
        const accGameGrid = document.getElementById('accGameGrid');
        if (accGameGrid) {
            accGameGrid.innerHTML = '';
            if (accGameList && accGameList.length > 0) {
                accGameList.forEach(item => {
                    accGameGrid.innerHTML += `
                        <div class="acc-card">
                            <span class="acc-tag">${item.tag || 'HOT'}</span>
                            <img src="${item.img || 'https://i.ibb.co/4wcD0R4k/image.jpg'}" class="acc-img">
                            <div class="acc-body">
                                <div class="acc-title">${item.title}</div>
                                <div class="acc-footer">
                                    <div class="price">${Number(item.price).toLocaleString('vi-VN')} đ</div>
                                    ${item.is_sold ? `<button class="btn btn-login" disabled>ĐÃ BÁN</button>` : 
                                    `<button class="btn btn-success" onclick="openConfirmBuyModal('${item.id}')"><i class="fa-solid fa-cart-shopping"></i> Mua Ngay</button>`}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                accGameGrid.innerHTML = '<p style="color:#94a3b8;">Chưa có tài khoản nào bán.</p>';
            }
        }

        const serviceGrid = document.getElementById('serviceGrid');
        if (serviceGrid) {
            serviceGrid.innerHTML = `
                <div class="acc-card">
                    <span class="acc-tag" style="background:#f59e0b;">CÀY THUÊ UI</span>
                    <img src="https://i.ibb.co/4wcD0R4k/image.jpg" class="acc-img">
                    <div class="acc-body">
                        <div class="acc-title">DỊCH VỤ CÀY THUÊ BLOX FRUIT</div>
                        <p style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">Bao gồm V4, Level, Beli, Fragment, Items Mythic, Võ, Kiếm...</p>
                        <div class="acc-footer">
                            <div class="price">sẵn sàng</div>
                            <button class="btn btn-primary" onclick="openOrderServiceModal()"><i class="fa-solid fa-bolt"></i> Thuê Ngay</button>
                        </div>
                    </div>
                </div>
            `;
        }
    }

    /* --- MUA ACC --- */
    async function openConfirmBuyModal(accId) {
        if (!currentUser) return openAuthModal('login');
        const { data: acc } = await supabaseClient.from('acc_games').select('*').eq('id', accId).single();
        if (!acc) return;
        selectedAccToBuy = acc;
        document.getElementById('confirmAccTitle').innerText = acc.title;
        document.getElementById('confirmAccPrice').innerText = Number(acc.price).toLocaleString('vi-VN') + ' đ';
        document.getElementById('btnConfirmBuyProceed').onclick = processBuyAcc;
        openModal('confirmBuyModal');
    }

    async function processBuyAcc() {
        if (!selectedAccToBuy || !currentUser) return;
        const balance = await getUserBalance(currentUser.email);
        if (balance < selectedAccToBuy.price) {
            closeModal('confirmBuyModal');
            return showToast('Số dư không đủ, vui lòng nạp thêm!', 'error');
        }

        await updateUserBalance(currentUser.email, -selectedAccToBuy.price);
        await supabaseClient.from('acc_games').update({ is_sold: true, buyer_email: currentUser.email }).eq('id', selectedAccToBuy.id);

        document.getElementById('resUser').innerText = selectedAccToBuy.user || selectedAccToBuy.acc_user || 'N/A';
        document.getElementById('resPass').innerText = selectedAccToBuy.pass || selectedAccToBuy.acc_pass || 'N/A';
        document.getElementById('resPass3').innerText = selectedAccToBuy.pass3 || selectedAccToBuy.acc_pass3 || 'Không có';

        closeModal('confirmBuyModal');
        openModal('buyAccResultModal');
        await checkUserStatus();
        await renderShopItems();
    }

    /* --- ĐẶT CÀY THUÊ --- */
    function openOrderServiceModal() {
        if (!currentUser) return openAuthModal('login');
        updateSelectedServicePrice();
        openModal('orderServiceModal');
    }

    function updateSelectedServicePrice() {
        const selectMenu = document.getElementById('serviceSelectMenu');
        if (!selectMenu) return;
        const selectedOption = selectMenu.options[selectMenu.selectedIndex];
        if (selectedOption) {
            const price = parseInt(selectedOption.getAttribute('data-price'));
            document.getElementById('displayServicePrice').innerText = Number(price).toLocaleString('vi-VN') + ' đ';
        }
    }

    async function handleConfirmOrder(e) {
        e.preventDefault();
        if (!currentUser) return openAuthModal('login');

        const selectMenu = document.getElementById('serviceSelectMenu');
        const selectedOption = selectMenu.options[selectMenu.selectedIndex];
        const serviceName = selectedOption.value;
        const price = parseInt(selectedOption.getAttribute('data-price'));

        const robloxUser = document.getElementById('robloxUser').value.trim();
        const robloxPass = document.getElementById('robloxPass').value.trim();
        const robloxPass3 = document.getElementById('robloxPass3').value.trim();

        const balance = await getUserBalance(currentUser.email);
        if (balance < price) {
            closeModal('orderServiceModal');
            return showToast('Số dư tài khoản không đủ để đặt gói này!', 'error');
        }

        await updateUserBalance(currentUser.email, -price);

        const { error } = await supabaseClient.from('orders').insert([{
            user_email: currentUser.email,
            service_name: serviceName,
            price: price,
            roblox_user: robloxUser,
            roblox_pass: robloxPass,
            roblox_pass3: robloxPass3,
            status: 'pending'
        }]);

        if (error) {
            showToast('Lỗi đặt đơn: ' + error.message, 'error');
        } else {
            showToast('Đặt dịch vụ cày thuê thành công!', 'success');
            closeModal('orderServiceModal');
            checkUserStatus();
        }
    }

    /* --- NẠP TIỀN (QR CODE & THẺ CÀO) --- */
    function openDepositModal() {
        if (!currentUser) return openAuthModal('login');
        switchDepositTab('qr');
        openModal('depositModal');
    }

    function switchDepositTab(type) {
        document.getElementById('depositTabQR').style.display = type === 'qr' ? 'block' : 'none';
        document.getElementById('depositTabCard').style.display = type === 'card' ? 'block' : 'none';
        document.getElementById('btnTabQR').className = type === 'qr' ? 'btn btn-primary' : 'btn btn-login';
        document.getElementById('btnTabCard').className = type === 'card' ? 'btn btn-primary' : 'btn btn-login';
    }

    function generateQRCode() {
        const amount = parseInt(document.getElementById('qrAmount').value);
        if (!amount || amount < 10000) return showToast('Số tiền nạp tối thiểu là 10.000đ', 'error');
        
        // Cấu hình thông tin ngân hàng của bạn tại đây
        const bankId = "MB"; // Mã ngân hàng (VD: MB, VCB, TCB...)
        const accountNumber = "0335759739"; // Số tài khoản nhận tiền
        const accountName = "NGUYEN CHI NGHIA"; // Chủ tài khoản
        const addInfo = `NAP ${currentUser.email.split('@')[0]} ${amount}`;
        
        const qrUrl = `https://img.vietqr.io/image/${bankId}-${accountNumber}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(addInfo)}&accountName=${encodeURIComponent(accountName)}`;
        
        document.getElementById('qrCodeImage').src = qrUrl;
        document.getElementById('qrResultBox').style.display = 'block';
        document.getElementById('qrContentInfo').innerText = addInfo;
    }

    async function submitCardDeposit(e) {
        e.preventDefault();
        const telco = document.getElementById('cardTelco').value;
        const amount = parseInt(document.getElementById('cardAmount').value);
        const pin = document.getElementById('cardPin').value.trim();
        const serial = document.getElementById('cardSerial').value.trim();

        // Ghi nhận thẻ cào vào bảng logs hoặc orders chờ admin duyệt
        const { error } = await supabaseClient.from('orders').insert([{
            user_email: currentUser.email,
            service_name: `Nạp Thẻ: ${telco} - ${amount.toLocaleString()}đ (PIN: ${pin} | Seri: ${serial})`,
            price: -amount, // Lưu dạng giao dịch thẻ nạp chờ duyệt
            status: 'pending_card'
        }]);

        if (error) {
            showToast('Lỗi gửi thẻ: ' + error.message, 'error');
        } else {
            showToast('Gửi thẻ thành công! Hệ thống sẽ duyệt sau 1-3 phút.', 'success');
            closeModal('depositModal');
        }
    }

    /* --- LỊCH SỬ GIAO DỊCH --- */
    async function openHistoryModal() {
        if (!currentUser) return openAuthModal('login');
        const { data: myOrders } = await supabaseClient.from('orders').select('*').eq('user_email', currentUser.email).order('created_at', { ascending: false });
        
        const tbody = document.getElementById('historyTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (myOrders && myOrders.length > 0) {
            myOrders.forEach(o => {
                let badgeClass = o.status === 'completed' ? 'status-completed' : 'status-pending';
                let statusText = o.status === 'completed' ? 'Đã hoàn thành' : 'Đang xử lý';
                tbody.innerHTML += `
                    <tr>
                        <td>Cày Thuê / Nạp Thẻ</td>
                        <td><b>${o.service_name}</b></td>
                        <td style="color:${o.price > 0 ? '#22c55e' : '#ef4444'}">${o.price.toLocaleString('vi-VN')} đ</td>
                        <td>${o.roblox_user ? `TK: ${o.roblox_user}` : 'Giao dịch trực tiếp'}</td>
                        <td><span class="status-badge ${badgeClass}">${statusText}</span></td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Chưa có lịch sử giao dịch nào.</td></tr>';
        }
        openModal('historyModal');
    }

    /* --- ADMIN DASHBOARD --- */
    async function openAdminDashboard() {
        await loadAdminOrders();
        await loadAdminAccSell();
        await loadAdminUsersBalance();
        openModal('adminModal');
    }

    async function loadAdminOrders() {
        const { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
        const tbody = document.getElementById('adminOrderTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (orders && orders.length > 0) {
            orders.forEach(o => {
                tbody.innerHTML += `
                    <tr>
                        <td>${o.id.slice(0, 6)}</td>
                        <td>${o.user_email}</td>
                        <td><b>${o.service_name}</b></td>
                        <td style="color:#22c55e;">${o.price.toLocaleString('vi-VN')} đ</td>
                        <td>${o.roblox_user || 'Không có'}</td>
                        <td>${o.roblox_pass || 'Không có'}</td>
                        <td>${o.roblox_pass3 || 'Không có'}</td>
                        <td><span class="status-badge ${o.status === 'completed' ? 'status-completed' : 'status-pending'}">${o.status}</span></td>
                        <td>
                            ${o.status !== 'completed' ? `<button class="btn btn-success" style="padding:5px 10px; font-size:12px;" onclick="completeOrder('${o.id}')">Duyệt</button>` : ''}
                            <button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" onclick="deleteOrder('${o.id}')">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }
    }

    async function completeOrder(orderId) {
        await supabaseClient.from('orders').update({ status: 'completed' }).eq('id', orderId);
        showToast('Đã duyệt đơn hàng thành công!', 'success');
        loadAdminOrders();
    }

    async function deleteOrder(orderId) {
        await supabaseClient.from('orders').delete().eq('id', orderId);
        showToast('Đã xóa đơn hàng!', 'success');
        loadAdminOrders();
    }

    async function handleAddNewAccGame(e) {
        e.preventDefault();
        const newAcc = {
            title: document.getElementById('newAccTitle').value.trim(),
            price: parseFloat(document.getElementById('newAccPrice').value),
            tag: document.getElementById('newAccTag').value.trim(),
            user: document.getElementById('newAccUser').value.trim(),
            pass: document.getElementById('newAccPass').value.trim(),
            pass3: document.getElementById('newAccPass3').value.trim(),
            img: document.getElementById('newAccImg').value.trim(),
            is_sold: false
        };
        const { error } = await supabaseClient.from('acc_games').insert([newAcc]);
        if (error) {
            showToast('Lỗi đăng acc: ' + error.message, 'error');
        } else {
            showToast('Đăng bán tài khoản thành công!', 'success');
            e.target.reset();
            loadAdminAccSell();
            renderShopItems();
        }
    }

    async function loadAdminAccSell() {
        const { data: accs } = await supabaseClient.from('acc_games').select('*');
        const tbody = document.getElementById('adminAccSellTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (accs) {
            accs.forEach(a => {
                tbody.innerHTML += `
                    <tr>
                        <td>${a.id.slice(0, 6)}</td>
                        <td>${a.title}</td>
                        <td>${a.user || a.acc_user || ''}</td>
                        <td>${a.pass || a.acc_pass || ''}</td>
                        <td>${a.pass3 || a.acc_pass3 || ''}</td>
                        <td>${Number(a.price).toLocaleString()} đ</td>
                        <td>${a.is_sold ? '<span style="color:#ef4444">Đã bán</span>' : '<span style="color:#22c55e">Còn hàng</span>'}</td>
                        <td><button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deleteAccGame('${a.id}')">Xóa</button></td>
                    </tr>
                `;
            });
        }
    }

    async function deleteAccGame(id) {
        await supabaseClient.from('acc_games').delete().eq('id', id);
        showToast('Đã xóa tài khoản game!', 'success');
        loadAdminAccSell();
        renderShopItems();
    }

    async function loadAdminUsersBalance() {
        const { data: balances } = await supabaseClient.from('user_balances').select('*');
        const tbody = document.getElementById('adminUserBalanceTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (balances) {
            balances.forEach(b => {
                tbody.innerHTML += `
                    <tr>
                        <td>${b.email}</td>
                        <td style="color:#22c55e; font-weight:bold;">${Number(b.balance).toLocaleString()} đ</td>
                        <td>
                            <button class="btn btn-success" style="padding:4px 8px; font-size:11px;" onclick="quickAdjust('${b.email}', 50000)">+50k</button>
                            <button class="btn btn-success" style="padding:4px 8px; font-size:11px;" onclick="quickAdjust('${b.email}', 100000)">+100k</button>
                        </td>
                    </tr>
                `;
            });
        }
    }

    async function quickAdjust(email, amount) {
        await updateUserBalance(email, amount);
        showToast(`Đã cộng thêm ${amount.toLocaleString()}đ cho ${email}`, 'success');
        loadAdminUsersBalance();
    }

    async function handleAdminAdjustBalance(e) {
        e.preventDefault();
        const email = document.getElementById('targetUserEmail').value.trim();
        const amount = parseInt(document.getElementById('adjustAmount').value);
        
        await updateUserBalance(email, amount);
        showToast(`Cập nhật số dư thành công cho ${email}!`, 'success');
        e.target.reset();
        loadAdminUsersBalance();
    }
</script>
