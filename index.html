<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP ACC GAME 24/7</title>
    <!-- Nhúng thư viện Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
        .box { background: #1e293b; max-width: 400px; margin: 30px auto; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { width: 95%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; background: #22c55e; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #16a34a; }
        .btn-login { background: #3b82f6; }
        .btn-login:hover { background: #2563eb; }
        #user-info { display: none; color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎮 SHOP ACC GAME TỰ ĐỘNG</h1>

    <!-- Form Đăng Ký / Đăng Nhập -->
    <div class="box" id="auth-box">
        <h3 id="form-title">Đăng Nhập / Đăng Ký</h3>
        <input type="email" id="email" placeholder="Nhập Email của bạn">
        <input type="password" id="password" placeholder="Nhập Mật khẩu (ít nhất 6 ký tự)">
        
        <button class="btn-login" onclick="login()">Đăng Nhập</button>
        <button onclick="register()">Đăng Ký Tài Khoản</button>
    </div>

    <!-- Khối hiển thị khi đã đăng nhập thành công -->
    <div class="box" id="user-info">
        <p id="welcome-msg"></p>
        <button style="background:#ef4444" onclick="logout()">Đăng Xuất</button>
    </div>

    <script>
        // 🛠️ ĐIỀN THÔNG TIN SUPABASE CỦA BẠN VÀO 2 DÒNG DƯỚI ĐÂY:
        const SUPABASE_URL = 'https://ybrqeguquwwzeonblmvo.supabase.co'; 
        const SUPABASE_KEY = 'ĐIỀN_ANON_KEY_CỦA_BẠN_VÀO_ĐÂY'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Hàm Đăng Ký
        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('Vui lòng nhập đủ Email và Mật khẩu!');

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert('Lỗi đăng ký: ' + error.message);
            else alert('Đăng ký thành công! Bạn có thể Đăng nhập ngay.');
        }

        // Hàm Đăng Nhập
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('Vui lòng nhập đủ Email và Mật khẩu!');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Lỗi đăng nhập: ' + error.message);
            } else {
                alert('Đăng nhập thành công!');
                checkUser();
            }
        }

        // Kiểm tra trạng thái Đăng nhập
        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('user-info').style.display = 'block';
                document.getElementById('welcome-msg').innerText = 'Xin chào: ' + user.email;
            } else {
                document.getElementById('auth-box').style.display = 'block';
                document.getElementById('user-info').style.display = 'none';
            }
        }

        // Hàm Đăng Xuất
        async function logout() {
            await supabaseClient.auth.signOut();
            alert('Đã đăng xuất!');
            checkUser();
        }

        // Tự động kiểm tra khi tải trang
        checkUser();
    </script>
</body>
</html>
