<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Game & Cày Thuê</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-center text-yellow-500">⚡ DANH SÁCH DỊCH VỤ & TÀI KHOẢN ⚡</h1>
        
        <!-- Khu vực hiển thị sản phẩm động do Admin thêm -->
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Sản phẩm sẽ được render tự động ở đây -->
        </div>
    </div>

    <script>
        // Tải danh sách sản phẩm từ localStorage khi vào trang
        window.addEventListener('DOMContentLoaded', () => {
            const products = JSON.parse(localStorage.getItem('shop_products')) || [];
            const container = document.getElementById('product-list');
            
            if (products.length === 0) {
                container.innerHTML = `<p class="text-center col-span-3 text-gray-400">Chưa có sản phẩm nào được thêm. Vui lòng vào trang quản trị để thêm sản phẩm!</p>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="bg-slate-800 rounded-lg overflow-hidden shadow-lg border border-slate-700">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <span class="inline-block px-2 py-1 text-xs font-semibold bg-red-600 rounded mb-2">${p.badge || 'HOT'}</span>
                        <h3 class="text-lg font-bold mb-2">${p.name}</h3>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-green-400 font-bold text-xl">${p.price}</span>
                            <button class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm font-semibold transition">Thuê Ngay</button>
                        </div>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
