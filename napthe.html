<div class="card-box" style="background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; color: #fff; font-family: sans-serif; margin: 20px auto;">
    <h3 style="text-align: center; color: #38bdf8; margin-top: 0;">NẠP THẺ CÀO TỰ ĐỘNG</h3>
    <form id="napTheForm">
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-size:14px;">Chọn Nhà Mạng:</label>
            <select id="telco" style="width: 100%; padding: 10px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155;">
                <option value="VIETTEL">Viettel</option>
                <option value="VINAPHONE">Vinaphone</option>
                <option value="MOBIFONE">Mobifone</option>
                <option value="ZING">Zing</option>
            </select>
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-size:14px;">Chọn Mệnh Giá:</label>
            <select id="amount" style="width: 100%; padding: 10px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155;">
                <option value="10000">10.000đ</option>
                <option value="20000">20.000đ</option>
                <option value="50000">50.000đ</option>
                <option value="100000">100.000đ</option>
                <option value="200000">200.000đ</option>
                <option value="500000">500.000đ</option>
                <option value="1000000">1.000.000đ</option>
            </select>
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-size:14px;">Số Seri Thẻ:</label>
            <input type="text" id="serial" required placeholder="Nhập số seri" style="width: 100%; padding: 10px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-size:14px;">Mã Thẻ (PIN):</label>
            <input type="text" id="pin" required placeholder="Nhập mã thẻ cào" style="width: 100%; padding: 10px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155; box-sizing: border-box;">
        </div>
        <button type="submit" id="btnNap" style="width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">NẠP THẺ NGAY</button>
    </form>
    <div id="napMsg" style="margin-top: 15px; text-align: center; font-size: 14px;"></div>
</div>

<script>
    document.getElementById('napTheForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnNap');
        const msg = document.getElementById('napMsg');
        
        btn.disabled = true;
        btn.innerText = 'Đang xử lý...';
        msg.style.color = '#38bdf8';
        msg.innerText = 'Hệ thống đang gửi thẻ lên hệ thống...';

        const data = {
            telco: document.getElementById('telco').value,
            amount: document.getElementById('amount').value,
            serial: document.getElementById('serial').value,
            pin: document.getElementById('pin').value,
            username: localStorage.getItem('user_logged') || 'khach_an_Danh' // Tài khoản đang đăng nhập trên web của bạn
        };

        try {
            const res = await fetch('/api/nap-the', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if(result.success) {
                msg.style.color = '#4ade80';
                msg.innerText = 'Gửi thẻ thành công! Vui lòng đợi vài giây để hệ thống duyệt.';
            } else {
                msg.style.color = '#f87171';
                msg.innerText = 'Lỗi: ' + (result.message || 'Không thể gửi thẻ.');
            }
        } catch(err) {
            msg.style.color = '#f87171';
            msg.innerText = 'Lỗi kết nối đến máy chủ!';
        } finally {
            btn.disabled = false;
            btn.innerText = 'NẠP THẺ NGAY';
        }
    });
</script>
