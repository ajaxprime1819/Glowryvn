<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-yellow-400">🛠️ Quản Lý Danh Sách Mục Shop</h1>
        
        <!-- Form thêm sản phẩm -->
        <div class="bg-slate-800 p-6 rounded-lg mb-8 border border-slate-700">
            <h2 class="text-xl font-semibold mb-4">Thêm Mục Mới</h2>
            <form id="add-product-form" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1">Tên gói / Tên Acc:</label>
                    <input type="text" id="p-name" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1">Giá tiền (VD: 50.000 đ):</label>
                        <input type="text" id="p-price" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Nhãn dán (VD: SIÊU TỐC, ACC VIP):</label>
                        <input type="text" id="p-badge" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1">Link Ảnh (URL hình ảnh):</label>
                    <input type="text" id="p-image" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white" placeholder="https://...">
                </div>
                <button type="submit" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded font-bold transition">Thêm Mục</button>
            </form>
        </div>

        <!-- Danh sách hiện tại để xóa -->
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
            <h2 class="text-xl font-semibold mb-4">Danh Sách Mục Hiện Có</h2>
            <div id="admin-product-list" class="space-y-3">
                <!-- Danh sách item quản lý -->
            </div>
        </div>
    </div>

    <script>
        function loadAdminProducts() {
            const products = JSON.parse(localStorage.getItem('shop_products')) || [];
            const container = document.getElementById('admin-product-list');
            
            if (products.length === 0) {
                container.innerHTML = `<p class="text-gray-400">Chưa có mục nào.</p>`;
                return;
            }

            container.innerHTML = products.map((p, index) => `
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded border border-slate-700">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" class="w-12 h-12 object-cover rounded">
                        <div>
                            <h4 class="font-bold">${p.name}</h4>
                            <span class="text-green-400 text-sm">${p.price}</span>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${index})" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm font-semibold">Xóa</button>
                </div>
            `).join('');
        }

        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const products = JSON.parse(localStorage.getItem('shop_products')) || [];
            
            const newProduct = {
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                badge: document.getElementById('p-badge').value,
                image: document.getElementById('p-image').value
            };

            products.push(newProduct);
            localStorage.setItem('shop_products', JSON.stringify(products));
            
            alert('Thêm thành công!');
            e.target.reset();
            loadAdminProducts();
        });

        window.deleteProduct = function(index) {
            let products = JSON.parse(localStorage.getItem('shop_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('shop_products', JSON.stringify(products));
            loadAdminProducts();
        };

        window.addEventListener('DOMContentLoaded', loadAdminProducts);
    </script>
</body>
</html>
